name: Build APK
on:
  workflow_dispatch:
    inputs:
      app_path:
        description: 'Ruta de la app dentro del repo (apps/<job_id>)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decodificar keystore desde secret
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "${{ inputs.app_path }}/keystore.jks"

      - name: Crear proyecto Capacitor
        run: |
          APP_DIR="${{ inputs.app_path }}"
          cd "$APP_DIR"
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android

      - name: Generar iconos desde logo (si existe)
        run: |
          APP_DIR="${{ inputs.app_path }}"
          if [ -f "$APP_DIR/icon.png" ]; then
            RES="$APP_DIR/android/app/src/main/res"
            for SIZE in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              DIR="${SIZE%%:*}"; DIM="${SIZE##*:}"
              mkdir -p "$RES/mipmap-$DIR"
              convert "$APP_DIR/icon.png" -resize ${DIM}x${DIM} "$RES/mipmap-$DIR/ic_launcher.png"
              cp "$RES/mipmap-$DIR/ic_launcher.png" "$RES/mipmap-$DIR/ic_launcher_round.png"
            done
            # también el ícono de "adaptive" (fondo + ic_launcher_foreground)
            mkdir -p "$RES/mipmap-anydpi-v26"
            if [ -f "$RES/mipmap-anydpi-v26/ic_launcher.xml" ]; then
              sed -i 's/#00000000/#FFFFFF00/g' "$RES/mipmap-anydpi-v26/ic_launcher.xml" 2>/dev/null || true
            fi
          fi

      - name: Configurar firma en Gradle
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          APP_DIR="${{ inputs.app_path }}"
          KS_PASS="$KS_PASS" KS_ALIAS="$KS_ALIAS" python3 - <<'EOF'
          import os, re
          app = os.environ['APP_DIR']
          path = os.path.join(app, 'android', 'app', 'build.gradle')
          with open(path, 'r') as f:
              src = f.read()
          signing = """
          signingConfigs {
              release {
                  storeFile file('../../keystore.jks')
                  storePassword System.getenv('KS_PASS')
                  keyAlias System.getenv('KS_ALIAS')
                  keyPassword System.getenv('KS_PASS')
              }
          }
          """
          if 'signingConfigs' not in src:
              src = src.replace('android {', 'android {' + signing, 1)
          src = re.sub(r'buildTypes\s*\{\s*release\s*\{', 'buildTypes {\n        release {\n            signingConfig signingConfigs.release', src, count=1)
          with open(path, 'w') as f:
              f.write(src)
          EOF

      - name: Compilar APK + AAB
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          cd "${{ inputs.app_path }}/android"
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Publicar Release con los builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_ID="$(basename ${{ inputs.app_path }})"
          TAG="build-$APP_ID"
          APK="${{ inputs.app_path }}/android/app/build/outputs/apk/release/app-release.apk"
          AAB="${{ inputs.app_path }}/android/app/build/outputs/bundle/release/app-release.aab"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" "$APK" "$AAB" --title "Build $APP_ID" --generate-notes
